<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="./images/qr-code-scan-service-banner-3d-hand-with-smartphone-scans-qr-code-template-design-for-website-landing-page-ui-social-media-illustration-vector.webp" />
    <title>QR-code generator</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="mainContainer">
      <div class="sidebar">
        <div class="textContainer">
            <h1>generate QR Code</h1>
            <p>Just in one click</p>
        </div>
      </div>
      <div class="homeContainer">
        <div class="home ">
            <h2>Enter Text or URL</h2>
            <input type="text" id="qrInput" placeholder="Text or URl">
              <button id="generateBtn">Generate QR Code</button>
        </div>
      </div>
    </div>

    <div class="qrpopup">
        <h2>QR generated</h2>
        <img src="" alt="qr image" id="qrImg">
        <button id="downloadBtn">Download QR</button>
        <button id="coloseBtn">Close QR</button>
    </div>


  </body>
  <script src="./script.js"></script>
</html>
